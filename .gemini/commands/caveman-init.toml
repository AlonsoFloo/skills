description = "Drop the always-on caveman activation rule into the current repo for every IDE agent"
prompt = "Write the per-repo caveman rule files (Cursor, Windsurf, Cline, Copilot, AGENTS.md) into the current repo, then report the result.\n\nHow to run the init script — pick the first that applies:\n\n1. If `src/tools/caveman-init.js` exists in the current repo (you are inside a caveman checkout), run: `node src/tools/caveman-init.js {{args}}`\n2. Otherwise download and run the standalone script (it is self-contained and supports stdin execution): `curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/src/tools/caveman-init.js | node - {{args}}`\n\nUse `--dry-run` first if the user did not pass `--force`, so we never silently overwrite an existing rule file."
