name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: apm-audit-main-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pack-and-upload:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: 'true'
          apm-version: 'latest'

      # ── Pre-flight audit ──────────────────────────────
      - name: Dry-run compile
        run: apm compile --dry-run

      - name: Check dependency freshness
        run: apm outdated
        continue-on-error: true

      - name: Security & drift audit
        run: apm audit --no-fail-fast --no-cache

      # ── Pack & release ────────────────────────────────
      - name: Pack skill
        run: apm pack --archive --format plugin

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for archive in build/*.zip build/*.tgz build/*.tar.gz; do
            [ -f "$archive" ] || continue
            echo "Uploading $archive"
            gh release upload "$TAG" "$archive" --clobber
          done

      - name: Prepend download table to release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          existing_body="$(gh release view "$TAG" --json body -q .body)"

          table='## 📦 Downloads'$'\n\n'
          table+='| File | Size | SHA-256 |'$'\n'
          table+='|------|------|---------|'$'\n'

          for archive in build/*.zip build/*.tgz build/*.tar.gz; do
            [ -f "$archive" ] || continue

            filename="$(basename "$archive")"
            size="$(du -h "$archive" | cut -f1)"
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            url="https://github.com/${REPO}/releases/download/${TAG}/${filename}"

            table+="| [${filename}](${url}) | ${size} | \`${sha}\` |"$'\n'
          done

          table+='\n\n---\n\n'

          gh release edit "$TAG" --notes "${table}${existing_body}"
