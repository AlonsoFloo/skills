name: AlonsoFlooSkills

author: AlonsoFloo

version: "2.4.1" # x-release-please-version

description: Personal, agent-friendly engineering skills for architecture, code
  quality, testing, mobile development, and DevOps.

license: MIT

targets:
  - agent-skills
  - copilot
  - antigravity
  - opencode

includes: auto

dependencies:
  apm:
    # Kotlin development best practices and Kotlin-specific agent guidance.
    - Kotlin/kotlin-agent-skills#main

    # Android development skills and best practices.
    - android/skills#aaca635061a4befdd3890d63c4a02963f2e8d925 #v1.0.10

    # Swift concurrency: async/await, actors, Sendable, structured concurrency, and modern Swift concurrency patterns.
    # Starting 2.2.0 it introduced Agent portable plugin that miss behave with APM 0.29.0
    # Since then, the skill folder is pinned
    - AvdLee/Swift-Concurrency-Agent-Skill/skills/swift-concurrency#45fa49e4e0b2af4d43b1cb458903f8030ac993bd #2.3.0

    # Jetpack Compose animations and Kotlin control-flow best practices.
    - git: https://github.com/chrisbanes/skills.git
      ref: 2d202c722c1815007619ee0b667401b9d42e456e #2026.8.27
      skills:
        - compose-animations
        - kotlin-control-flow
        - kotlin-concurrency-and-flow

    # Jetpack Compose modifier ordering and efficient modifier chains.
    - git: https://github.com/skydoves/compose-performance-skills.git
      ref: main
      path: modifiers/ordering-modifier-chains

    # Efficient handling of side effects in Jetpack Compose.
    - git: https://github.com/skydoves/compose-performance-skills.git
      ref: main
      path: side-effects/using-efficient-effects

    # Curated skills from awesome-copilot.
    - git: https://github.com/github/awesome-copilot.git
      ref: main
      skills:
        - apple-appstore-reviewer
        - conventional-branch
        - conventional-commit
        - security-review
        - Thinking-Beast-Mode
      alias: github-awesome-copilot

devDependencies:
  apm:
    # Skill development: guidance for creating, validating, and maintaining
    # agent skills.
    - git: anthropics/skills
      ref: main
      skills:
        - skill-creator
      alias: anthropics-skills
